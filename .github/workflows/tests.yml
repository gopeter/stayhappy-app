name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & UI Tests
    # `RootView` referenziert `TabRole.prominent`, also iOS-27-API. Das Symbol
    # muss zur Compile-Zeit existieren (die `#available`-Abfrage schaltet es nur
    # zur Laufzeit ab), deshalb reicht das `macos-26`-Image mit Xcode 26 nicht:
    # dessen neuestes iOS-SDK ist 26.x. `xcode-27` ist GitHubs Preview-Image.
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      # Niedrigste iOS-SDK-Major-Version, mit der das Projekt kompiliert.
      REQUIRED_IOS_SDK_MAJOR: 27

    steps:
      - uses: actions/checkout@v4

      # Wählt das neueste installierte Xcode, dessen iOS-SDK neu genug ist, und
      # bricht sonst mit einer klaren Meldung ab, statt den Fehler erst als
      # "cannot be resolved without a contextual type" im Compile-Log zu zeigen.
      - name: Select Xcode
        run: |
          selected=""
          for app in $(ls -d /Applications/Xcode*.app | sort -Vr); do
            sdk=$("$app/Contents/Developer/usr/bin/xcodebuild" -version -sdk iphonesimulator SDKVersion 2>/dev/null | head -n1)
            echo "$app -> iOS SDK ${sdk:-unbekannt}"
            if [ -z "$selected" ] && [ -n "$sdk" ] && [ "${sdk%%.*}" -ge "$REQUIRED_IOS_SDK_MAJOR" ]; then
              selected="$app"
            fi
          done
          if [ -z "$selected" ]; then
            echo "::error::Kein Xcode mit iOS-${REQUIRED_IOS_SDK_MAJOR}-SDK auf diesem Runner gefunden."
            exit 1
          fi
          sudo xcode-select -s "$selected"
          xcodebuild -version

      # Die aufgelösten SPM-Abhängigkeiten werden gecacht, damit nicht bei jedem
      # Push alle Pakete neu geklont werden. Der Key hängt an Package.resolved.
      - name: Cache Swift Packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('StayHappy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      # Der Runner hat je nach Image unterschiedliche Gerätenamen installiert,
      # deshalb wird das neueste verfügbare iPhone zur Laufzeit ermittelt.
      - name: Pick iOS Simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys

          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted((k for k in devices if "iOS" in k), reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("Kein iPhone-Simulator auf dem Runner gefunden")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project StayHappy.xcodeproj \
            -scheme StayHappy \
            -clonedSourcePackagesDirPath .spm

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project StayHappy.xcodeproj \
            -scheme StayHappy \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
